# A Task that runs a coding agent on the OpenAI Responses API.
#
# The agent chains one response per turn with previous_response_id and works
# in /workspace through local shell and file tools. HTTP MCP servers on the
# Workspace are connected by the API itself. spec.command is left empty so
# the runner starts the agent, which reads spec.config.
#
# spec.image is the public image ghcr.io/rakyll/ax-images/openai.
# Every release tag rebuilds it and pins this line to the new digest;
# Substrate rejects tag-only image references.
#
# Pass OPENAI_API_KEY through spec.env, substituting it at apply time
# instead of committing it:
#
#   OPENAI_API_KEY=... envsubst < images/openai/task.yaml | ax apply -f -
#
# To run your own build instead:
#
#   make push-openai pin IMAGE_REPO=<your-registry>
#
# Then:
#
#   ax describe task openai
#   ax ssh openai -- cat /workspace/agent-output.md
#   ax ssh openai -- git -C /workspace diff
apiVersion: ax.io/v1alpha1
kind: Workspace
metadata:
  name: itsdangerous-openai
  atespace: default
spec:
  git:
    - name: origin
      repo: "https://github.com/pallets/itsdangerous.git"
      branch: "main"
  files:
    - path: "AGENTS.md"
      content: |
        # Working in this repo
        - Pure-Python library. Install with `pip install -e . pytest`, test with `pytest`.
        - Keep changes small and focused; do not add runtime dependencies.
        - Do not push or open pull requests. Leave changes in the working tree.
  # MCP servers declared here are handed to the agent.
  # mcp:
  #   servers:
  #     - name: docs
  #       endpoint: "http://docs-mcp.default.svc.cluster.local:8080/mcp"
---
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: openai
  atespace: default
spec:
  image: "ghcr.io/rakyll/ax-images/openai@sha256:b986e4bc0ff4b4e703fe2f23883c25d0b342e95a0da60c1512d6af7071d61018"
  config:
    prompt: |
      Read the repository, install it with its test dependencies, and run the
      test suite. Fix any failing or flaky tests you find. If everything passes,
      make one small, clearly correct improvement to the README. Finish by
      writing a short markdown report of what you checked and what you changed
      to /workspace/agent-output.md.
    model: gpt-5.5
    maxTurns: 50
    # OpenAI's hosted tools, alongside the local shell and file tools.
    builtinTools: ["web_search"]
    # Extra top-level request fields, passed through unchanged.
    # parameters:
    #   reasoning: {effort: high}
    # Instructions for every response; none by default.
    # instructions: "You are ..."
  env:
    - name: OPENAI_API_KEY
      value: "${OPENAI_API_KEY}"
  resources:
    limits:
      cpu: "2"
      memory: "4Gi"
  workspace:
    name: itsdangerous-openai
  debug: true # serve guest services so `ax ssh` works; off by default
