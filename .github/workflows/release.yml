# On every tag, build every image under images/ for linux/amd64 and
# linux/arm64, push it to ghcr.io/<owner>/ax-images/<name> as :<tag> and
# :latest, pin each task.yaml on main to the pushed digest, and attach the
# pinned manifests to a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/ax-images

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build binaries
        run: |
          make binaries ARCH=amd64
          make binaries ARCH=arm64

      - name: Build and push images
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for img in $(make -s list-images); do
            echo "::group::$img"
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              -f "images/$img/Dockerfile" \
              -t "$IMAGE_REPO/$img:$TAG" \
              -t "$IMAGE_REPO/$img:latest" \
              --metadata-file "bin/$img.json" \
              --push .
            jq -r '."containerimage.digest"' "bin/$img.json" > "bin/$img.digest"
            echo "$IMAGE_REPO/$img@$(cat "bin/$img.digest")" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done

      - name: Pin manifests on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # main may move while the images build, so pin against the latest
          # main and retry if a push lands in between.
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            make pin
            if git diff --quiet; then
              echo "Manifests already pinned."
              break
            fi
            git commit -am "Pin task manifests to $TAG images"
            if git push origin main; then
              break
            fi
            [ "$attempt" = 3 ] && exit 1
            sleep 5
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p bin/release
          for img in $(make -s list-images); do
            cp "images/$img/task.yaml" "bin/release/$img.yaml"
          done
          gh release create "$TAG" bin/release/*.yaml --verify-tag --generate-notes
